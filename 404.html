<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>길을 잃었어요 — mousekm</title>
  <meta name="robots" content="noindex" />
  <style>
    :root { --primary:#2383E2; --text:#191919; --sub:#787774; --bg:#FFFFFF; --surface:#F7F6F3; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 32px; text-align: center;
           font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', 'Malgun Gothic', sans-serif;
           color: var(--text); background: var(--surface); }
    .code { font-size: 72px; font-weight: 800; letter-spacing: -0.04em; color: var(--primary); }
    .code small { display: block; font-size: 14px; font-weight: 600; letter-spacing: 0; color: var(--sub); }
    h1 { font-size: 20px; margin: 12px 0 8px; }
    p { color: var(--sub); font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    a { display: inline-block; background: var(--primary); color: #fff; text-decoration: none;
        font-weight: 700; padding: 12px 24px; border-radius: 999px; }
    a:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <main>
    <p class="code">404<small>0.0km · 지도에 없는 곳</small></p>
    <h1>여긴 지도에 없는 곳이에요</h1>
    <p>주소가 바뀌었거나 없어진 페이지예요.<br>서울역에서 다시 출발해 볼까요?</p>
    <a href="/">처음부터 출발하기</a>
  </main>
</body>
</html>
