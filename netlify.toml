[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "20"
  # wall.js 의 Firebase 웹 API 키는 공개용 클라이언트 키(도메인 허용목록·보안 규칙으로 보호)라
  # 실제 비밀이 아니다. [functions] 를 켜면 빌드가 스캔 대상이 되는데,
  # Netlify 비밀 스캐너가 이 키를 오탐해 빌드를 막는다. 서트레스와 동일하게 끈다.
  SECRETS_SCAN_ENABLED = "false"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 확장 소스는 캐시를 짧게 (개발자 모드 설치 시 최신 파일 확인)
[[headers]]
  for = "/extension/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
