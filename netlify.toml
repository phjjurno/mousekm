[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 확장 소스는 캐시를 짧게 (개발자 모드 설치 시 최신 파일 확인)
[[headers]]
  for = "/extension/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
